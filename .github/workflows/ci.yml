name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium --only-shell
      - run: npm run build -w @krds-detector/contracts
      - run: npm run build -w @krds-detector/synth-eval
      - run: npm run build -w @krds-detector/scanner
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
