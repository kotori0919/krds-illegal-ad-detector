<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>적대적 케이스</title>
    <style>
      .clip-victim { clip-path: inset(0 0 0 0); width: 2px; height: 2px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>적대적 케이스 모음</h1>
      <p id="adv-cyrillic">Сasino 신규가입 보너스 지급</p>
      <p id="adv-punct">카.지.노 첫충전 이벤트 안내</p>
      <p id="adv-digit">C4sino 무료체험 머니 지급</p>
      <p id="adv-mixed-jamo">카ㅈㅣ노 대출 간편 승인</p>
      <p id="adv-ancestor-opacity" style="opacity: 0"><span id="adv-ancestor-child">홀덤 머니상 환전 안내</span></p>
      <p id="adv-transform" style="position: absolute; transform: translateX(-5000px)">토토 고액 배당 보장</p>
      <p id="adv-clip" class="clip-victim">바카라 실시간 쿠폰 지급중</p>
      <p id="adv-hidden-overflow" style="overflow: hidden; width: 1px; height: 1px">슬롯 무료체험 머니 지급</p>
      <p id="adv-legit-animation" style="opacity: 0">로딩 중입니다. 잠시만 기다려 주세요.</p>
      <p id="adv-legit-brand">Samsung 서울 강남점 오픈 안내</p>
    </main>
  </body>
</html>
